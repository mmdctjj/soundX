name: Test Build (feat/test)

on:
  push:
    branches:
      - "feat/test"
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.platform }}/${{ matrix.arch }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            target: aarch64-apple-darwin
            command: build:mac:arm64
            bundle_subdir: aarch64-apple-darwin
          - os: macos-latest
            platform: mac
            arch: x64
            target: x86_64-apple-darwin
            command: build:mac:x64
            bundle_subdir: x86_64-apple-darwin
          - os: windows-latest
            platform: win
            arch: x64
            target: x86_64-pc-windows-msvc
            command: build:win
            bundle_subdir: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: win
            arch: arm64
            target: aarch64-pc-windows-msvc
            command: build:win:arm64
            bundle_subdir: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: ""
            command: build:linux
            bundle_subdir: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && format('{0}', matrix.target) || '' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build Dependencies
        run: |
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate
          pnpm --filter @soundx/services run build

      - name: Build Tauri App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter sound-x run ${{ matrix.command }}

      - name: List build outputs
        if: matrix.os != 'windows-latest'
        run: |
          echo "Listing Tauri bundle outputs..."
          ls -la apps/desktop/src-tauri/target/*/release/bundle/ 2>/dev/null || true
          find apps/desktop/src-tauri/target -type d -name "bundle" -exec ls -la {} \;

      - name: Rename macOS artifacts with arch suffix
        if: matrix.platform == 'mac'
        run: |
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle"
          cd "$BUNDLE_DIR/dmg" 2>/dev/null && {
            for f in *.dmg; do
              [ -f "$f" ] || continue
              base="${f%.dmg}"
              mv "$f" "${base}-${{ matrix.arch }}.dmg"
              echo "Renamed $f -> ${base}-${{ matrix.arch }}.dmg"
            done
          }
          cd "$BUNDLE_DIR/macos" 2>/dev/null && {
            for d in *.app; do
              [ -d "$d" ] || continue
              base="${d%.app}"
              mv "$d" "${base}-${{ matrix.arch }}.app"
              echo "Renamed $d -> ${base}-${{ matrix.arch }}.app"
            done
          }

      - name: Rename Windows artifacts with arch suffix
        if: matrix.platform == 'win'
        shell: bash
        run: |
          BUNDLE_DIR="apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle"
          cd "$BUNDLE_DIR/nsis" 2>/dev/null && {
            for f in *.exe; do
              [ -f "$f" ] || continue
              base="${f%.exe}"
              mv "$f" "${base}-${{ matrix.arch }}.exe"
              echo "Renamed $f -> ${base}-${{ matrix.arch }}.exe"
            done
          }

      - name: Upload Release Assets (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test Build (feat/test)
          draft: true
          files: |
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/dmg/*-${{ matrix.arch }}.dmg
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/macos/*-${{ matrix.arch }}.app
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/nsis/*-${{ matrix.arch }}.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Patch react-native-track-player
        run: |
          FILE=$(find node_modules -name MusicModule.kt | grep "react-native-track-player")
          if [ -n "$FILE" ]; then
            echo "Patching $FILE"
            sed -i 's/metadata.putBundle(Metas.METADATA_KEY_EXTRAS, bundle)/metadata.putBundle(Metas.METADATA_KEY_EXTRAS, bundle ?: Bundle())/g' "$FILE"
            sed -i 's/intent.putExtras(bundle)/intent.putExtras(bundle ?: Bundle())/g' "$FILE"
          else
            echo "MusicModule.kt not found"
          fi

      - name: Build Dependencies
        run: |
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate

      - name: Copy Network Security Config
        run: |
          mkdir -p apps/mobile/android/app/src/main/res/xml
          cp apps/mobile/network_security_config.xml apps/mobile/android/app/src/main/res/xml/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          cd apps/mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename and Prepare APK
        id: prepare_apk
        run: |
          VERSION=$(node -p "require('./apps/mobile/app.json').expo.version")
          OLD_PATH="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          NEW_NAME="AudioDock-${VERSION}-test.apk"
          NEW_PATH="apps/mobile/android/app/build/outputs/apk/release/${NEW_NAME}"
          mv "$OLD_PATH" "$NEW_PATH"
          echo "apk_path=$NEW_PATH" >> $GITHUB_OUTPUT

      - name: Upload Release Assets (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: Test Build (feat/test)
          draft: true
          files: |
            ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}