worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 设备识别：手机浏览器 -> mini H5；平板/PC -> desktop
    # iPad(iPadOS 13+ UA 报 Macintosh) 与 Android 平板(Android 无 Mobile) 落到 default -> desktop
    map $http_user_agent $spa_root {
        default              /usr/share/nginx/html/desktop;
        "~*android.*mobile"  /usr/share/nginx/html/mini;
        "~*iphone"           /usr/share/nginx/html/mini;
        "~*ipod"             /usr/share/nginx/html/mini;
        "~*windows phone"    /usr/share/nginx/html/mini;
        "~*blackberry"       /usr/share/nginx/html/mini;
        "~*mobile"           /usr/share/nginx/html/mini;
    }

    server {
        listen       9958;
        server_name  localhost;

        # 1. 静态文件 (前端 SPA)：按设备 UA 选择 mini H5 或 desktop
        location / {
            root   $spa_root;
            index  index.html index.htm;
            
            # 针对 index.html: 永远不缓存，确保用户总是获取最新版本
            if ($request_filename ~* ^.*?.(html|htm)$) {
                add_header Cache-Control "no-store, no-cache, must-revalidate";
            }

            # 针对静态资源 (JS/CSS/Images): 长期缓存，因为文件名带有 hash
            if ($request_filename ~* ^.*?.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$) {
                add_header Cache-Control "public, max-age=31536000, immutable";
            }

            try_files $uri $uri/ /index.html;
        }

        # 2. 可选代理：仅在后端地址配置时使用
        location /api/ {
            # 这里假设前端配置的后端地址在环境变量 BACKEND_URL
            # 需要在构建或运行容器时替换
            set $backend "http://127.0.0.1:3000"; 
            
            # 去掉 /api 前缀
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # 3. WebSocket 代理（desktop web 同源连接 socket.io，用于多端同步/接力）
        location /socket.io/ {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }

    }
}
