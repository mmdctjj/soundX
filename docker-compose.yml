version: "3.8"

services:
  app:
    platform: linux/amd64
    image: audiodock-app
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: audiodock-app
    ports:
      - "3000:3000" # Node API
      - "9958:9958" # Web UI
    environment:
      - NODE_ENV=production
      - TXT_BASE_DIR=/txt # 电子书目录
      - AUDIO_BOOK_DIR=/audio # 有声书目录
      - MUSIC_BASE_DIR=/music # 音乐目录
      - CACHE_DIR=/covers # 封面目录
      - DATABASE_URL=file:/data/dev.db
      - JWT_SECRET=/.jwt_secret
      - PORT=3000
      - STRM_ADDRESS=http://192.168.1.12:5244
      - DISABLE_TTS=${DISABLE_TTS:-false} # 是否禁用 tts 服务，不用tts功能可注释
      - DISABLE_ASR=${DISABLE_ASR:-false} # 是否禁用 asr 服务，不用语音助手可注释
      - DISABLE_MI=${DISABLE_MI:-false} # 是否禁用 mi 服务，不用小爱音箱功能可注释
      - VOICE_KEYWORDS=小苍小苍 # 语音唤醒关键词，多个用英文逗号分隔，按最长匹配优先

    # 挂载数据文件和缓存，使用 Docker 命名卷更安全
    volumes:
      # 这里可以根据需要调整物理机的挂载路径
      - ./services/api/music/txt:/txt
      - ./services/api/music/audio:/audio
      - ./services/api/music/music:/music/music
      - ./services/api/music/mv:/music/mv
      - ./services/api/music/covers:/covers
      - app-db:/app/packages/db/prisma # 将数据库文件目录挂载出来持久化
      - ./services/api/.jwt_secret:/.jwt_secret
      # 小爱音箱：认证文件 + SQLite 数据持久化（容器重建后保持登录态）
      - ./services/mi/auth.json:/app/services/mi/auth.json
      - ./services/mi/.mi.token:/app/services/mi/.mi.token
      - ./services/mi/data:/app/services/mi/data
    restart: unless-stopped
    networks:
      - audiodock-network

volumes:
  app-db: # 命名卷用于持久化数据库

networks:
  audiodock-network:
    driver: bridge
