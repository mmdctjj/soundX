version: "3.8"

services:
  app:
    platform: linux/amd64
    image: mmdctjj/audiodock
    container_name: audiodock-app
    ports:
      - "8860:3000" # Node API
      - "9961:9958" # Web UI
    environment:
      - NODE_ENV=production
      - TXT_BASE_DIR=/txt # 电子书目录 — Optional: prefer configuring via Settings → File Sources (DB-stored file_sources). Env values seed the DB on first boot and are ignored thereafter.
      - AUDIO_BOOK_DIR=/audio # 有声书目录 — Optional: prefer configuring via Settings → File Sources (DB-stored file_sources). Env values seed the DB on first boot and are ignored thereafter.
      - MUSIC_BASE_DIR=/music # 音乐目录 — Optional: prefer configuring via Settings → File Sources (DB-stored file_sources). Env values seed the DB on first boot and are ignored thereafter.
      - MV_BASE_DIR=/mv # mv视频目录 — Optional: prefer configuring via Settings → File Sources (DB-stored file_sources). Env values seed the DB on first boot and are ignored thereafter.
      - CACHE_DIR=/covers # 封面目录
      - DATABASE_URL=file:/data/dev.db # 数据库
      - JWT_SECRET=/.jwt_secret # 这个是文件，不是目录
      - PORT=3000
      - STRM_ADDRESS=http://192.168.1.12:5244
      - DISABLE_TTS=${DISABLE_TTS:-false} # 是否禁用 tts 服务，不用tts功能可注释
      - DISABLE_ASR=${DISABLE_ASR:-false} # 是否禁用 asr 服务，不用语音助手可注释
      - DISABLE_MI=${DISABLE_MI:-false} # 是否禁用 mi 服务，不用小爱音箱功能可注释
      - VOICE_KEYWORDS=小苍小苍 # 语音唤醒关键词，多个用英文逗号分隔，按最长匹配优先

    # 挂载数据文件和缓存，使用 Docker 命名卷更安全
    volumes:
      # 这里可以根据需要调整物理机的挂载路径
      - /volume1/迅雷下载/TXT:/txt
      - /volume1/迅雷下载/有声书:/audio
      - /volume1/迅雷下载/音乐:/music
      - /volume1/迅雷下载/MV:/mv
      - ./covers:/covers
      - app-db:/data
      - ./.jwt_secret:/.jwt_secret
    restart: unless-stopped
    networks:
      - audiodock-network

volumes:
  app-db: # 命名卷用于持久化数据库，下面的两行是保留旧数据的关键，没有旧数据
    external: true # 如果新部署，请注释，
    name: audiodock2_api-db # audiodock2 是我的旧 compose 名称，请相应的替换下

networks:
  audiodock-network:
    driver: bridge
