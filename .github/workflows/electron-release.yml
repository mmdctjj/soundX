name: Release Tauri App

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
            target: aarch64-apple-darwin
            command: build:mac:arm64
            bundle_subdir: aarch64-apple-darwin
          - os: macos-latest
            platform: mac
            arch: x64
            target: x86_64-apple-darwin
            command: build:mac:x64
            bundle_subdir: x86_64-apple-darwin
          - os: windows-latest
            platform: win
            arch: x64
            target: x86_64-pc-windows-msvc
            command: build:win
            bundle_subdir: x86_64-pc-windows-msvc
          - os: windows-latest
            platform: win
            arch: arm64
            target: aarch64-pc-windows-msvc
            command: build:win:arm64
            bundle_subdir: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            arch: x64
            target: ""
            command: build:linux
            bundle_subdir: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target && format('{0}', matrix.target) || '' }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install

      - name: Build Dependencies
        run: |
          pnpm --filter @soundx/ws run build
          pnpm --filter @soundx/i18e run build
          pnpm --filter @soundx/utils run build
          pnpm --filter @soundx/db run generate
          pnpm --filter @soundx/services run build

      - name: Build Tauri App
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm --filter sound-x run ${{ matrix.command }}

      - name: List build outputs
        if: matrix.os != 'windows-latest'
        run: |
          echo "Listing Tauri bundle outputs..."
          ls -la apps/desktop/src-tauri/target/*/release/bundle/ 2>/dev/null || true
          find apps/desktop/src-tauri/target -type d -name "bundle" -exec ls -la {} \;

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v5
        if: matrix.platform == 'mac' && matrix.arch == 'arm64' && startsWith(github.ref, 'refs/tags/')
        with:
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                    "title": "## 新功能",
                    "labels": ["feat", "feature", "Feat", "Feature"]
                },
                {
                    "title": "## 修复",
                    "labels": ["fix", "bug", "Fix", "Bug"]
                },
                {
                    "title": "## 更新内容",
                    "labels": []
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^\\s*(feat|fix|docs|style|refactor|perf|test|chore|revert|ci|build)(?:\\(.+\\))?!?: .+$",
                  "target": "$1",
                  "flags": "i"
                }
              ]
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Mac x64, append)
        uses: softprops/action-gh-release@v2.4.1
        if: matrix.platform == 'mac' && matrix.arch == 'x64' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/macos/*.app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Mac arm64, with changelog, makes latest)
        uses: softprops/action-gh-release@v2.4.1
        if: matrix.platform == 'mac' && matrix.arch == 'arm64' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/macos/*.app
          body: ${{ steps.build_changelog.outputs.changelog }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Assets (Win/Linux)
        uses: softprops/action-gh-release@v2.4.1
        if: matrix.platform != 'mac' && startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            apps/desktop/src-tauri/target/${{ matrix.bundle_subdir }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          make_latest: ${{ matrix.arch == 'x64' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}